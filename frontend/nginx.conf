server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ─── REST API reverse proxy ────────────────────────────────────────────────
    # All /api/* requests are forwarded to the backend container on the internal
    # Docker network. Port 5000 is NOT exposed to the internet — traffic stays
    # inside the Docker bridge network.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── Socket.IO WebSocket reverse proxy ────────────────────────────────────
    # Socket.IO uses /socket.io/ for both HTTP long-polling and WebSocket upgrade.
    # The Upgrade and Connection headers are REQUIRED for WebSocket protocol
    # negotiation — without them Socket.IO cannot complete the handshake.
    # proxy_read_timeout is set high to keep long-lived connections alive.
    location /socket.io/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── SPA routing ──────────────────────────────────────────────────────────
    # Fallback to index.html for all React Router client-side paths.
    # This must come AFTER the /api/ and /socket.io/ blocks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
